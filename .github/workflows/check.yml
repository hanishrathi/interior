name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Headless Chromium (and its system libraries) for the browser tests, at the version
      # the installed Playwright expects.
      - run: npx playwright install --with-deps --only-shell chromium

      # Typecheck, lint, unit and browser tests, design-system and product-data validators, build.
      - run: npm run check
